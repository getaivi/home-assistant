name: Release

# One-click release: computes the next semver from Conventional Commits with
# git-cliff and publishes a GitHub release with the aivi.zip asset that HACS
# installs (hacs.json: zip_release). Nothing is pushed: main takes changes
# only through pull requests, so the version goes into the zip's
# manifest.json alone and the release itself creates the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release tags the dispatched commit, so only main's is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its tag
      id-token: write # the Sigstore certificate behind the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs full history + tags

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Compute next version
        id: version
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next="$(uvx git-cliff --bumped-version)"
          if [ "$next" = "$latest" ]; then
            echo "No release-worthy commits since $latest; nothing to do." >&2
            exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      # Workspace only, never committed: Home Assistant and the panel's
      # cache busting read the version from the installed manifest.
      - name: Stamp manifest
        run: |
          tmp="$(mktemp)"
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            custom_components/aivi/manifest.json > "$tmp"
          mv "$tmp" custom_components/aivi/manifest.json

      # The panel bundle is generated (gitignored), so the zip needs a fresh
      # build: HACS installs come from this asset (hacs.json: zip_release).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build panel bundle
        run: |
          npm ci
          npm run build

      # A fresh checkout holds one build: the panel bundle and the one
      # content-hashed template editor it imports, which it names. The SF
      # Symbols index goes in gzipped too, which the panel's file view
      # sends a browser that takes gzip: 40 KB instead of 330.
      - name: Build HACS zip
        run: |
          cd custom_components/aivi
          gzip -9 -n -k frontend/sf-symbols.json
          editors=(frontend/aivi-code-editor-*.js)
          test "${#editors[@]}" -eq 1 && test -f "${editors[0]}"
          grep -qF "$(basename "${editors[0]}")" frontend/aivi-panel.js
          zip -r ../../aivi.zip . -x '*__pycache__*'
          unzip -l ../../aivi.zip | grep -F frontend/
          unzip -p ../../aivi.zip manifest.json |
            jq -e --arg v "${{ steps.version.outputs.version }}" '.version == $v'

      # Lets anyone check the zip came from this workflow and commit:
      # gh attestation verify aivi.zip --repo getaivi/home-assistant
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: aivi.zip

      # The tag does not exist yet, so the notes are the unreleased commits
      # under the new tag; gh creates the tag on the dispatched commit.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx git-cliff --unreleased --tag "${{ steps.version.outputs.tag }}" \
            --strip header > notes.md
          gh release create "${{ steps.version.outputs.tag }}" aivi.zip \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
