name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    # A merge group carries no title; the PR's was checked before it was
    # queued. The skipped job still reports the check, as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged with the PR title as the commit subject, so the
      # title is what git-cliff sees when computing the changelog and bump.
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
