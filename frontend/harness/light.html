<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>aivi panel harness (light)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fafafa; }
    :root {
      --primary-background-color: #fafafa;
      --card-background-color: #ffffff;
      --secondary-background-color: #f2f4f7;
      --primary-text-color: #1c2430;
      --secondary-text-color: #667084;
      --divider-color: #e0e4ea;
      /* See index.html: the always-present HA accent and card tokens. */
      --primary-color: #03a9f4;
      --ha-card-border-radius: 12px;
      --ha-card-box-shadow: 0 2px 2px 0 rgba(0,0,0,.07), 0 1px 5px 0 rgba(0,0,0,.06);
    }
  </style>
</head>
<body>
  <script type="module">
    import { mountPanelHost } from "./mock-hass.js";
    // Home Assistant defines <ha-icon>; here a stand-in does.
    import "./ha-icon.js";
    // Sample pictures from the harness folder, not the network.
    import "./pictures.js";
    import "../../custom_components/aivi/frontend/aivi-panel.js";

    const el = document.createElement("aivi-panel");
    el.style.display = "block"; el.style.height = "100vh";
    document.body.appendChild(el);
    // Assign hass/narrow/route/panel the way <ha-panel-custom> does.
    mountPanelHost(el);
  </script>
</body>
</html>
