<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>aivi panel harness (user theme)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b2836; }
    /* A non-default user theme (green accent, roomier card
       radius, elevated cards): every piece of panel chrome must follow
       these tokens. Brand blue appearing anywhere on this page means a
       color is hardcoded. */
    :root {
      --primary-background-color: #1b2836;
      --card-background-color: #243447;
      --secondary-background-color: #1e2c3a;
      --primary-text-color: #dee6ee;
      --secondary-text-color: #93a7bb;
      --divider-color: #33465c;
      --primary-color: #2e9e5b;
      --error-color: #e5707a;
      --warning-color: #d9a23f;
      --success-color: #58ba85;
      --ha-card-border-radius: 16px;
      --ha-card-border-color: #3a4f68;
      --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    }
  </style>
</head>
<body>
  <script type="module">
    import { mountPanelHost } from "./mock-hass.js";
    // Home Assistant defines <ha-icon>; here a stand-in does.
    import "./ha-icon.js";
    // Sample pictures from the harness folder, not the network.
    import "./pictures.js";
    import "../../custom_components/aivi/frontend/aivi-panel.js";

    const el = document.createElement("aivi-panel");
    el.style.display = "block"; el.style.height = "100vh";
    document.body.appendChild(el);
    // Assign hass/narrow/route/panel the way <ha-panel-custom> does.
    mountPanelHost(el);
    window.__panel = el;
  </script>
</body>
</html>
